<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>java_fight · AI 知识库问答</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script>window.Vue || document.write('<script src="https://cdn.jsdelivr.net/npm/vue@3/dist/vue.global.prod.js"><\/script>')</script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0 }
        body { font-family: system-ui, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #1d2939; -webkit-font-smoothing: antialiased }
        header { position: sticky; top: 0; z-index: 8; background: #0c131d; color: #fff; padding: 12px 28px; display: flex; justify-content: space-between; align-items: center }
        .brand { font-weight: 800; font-size: 17px; letter-spacing: .01em; display: flex; align-items: center }
        .brand::before { content: ''; width: 11px; height: 11px; border-radius: 3px; background: #14b8a6; margin-right: 10px }
        .brand span { font-weight: 400; opacity: .55; margin-left: 10px; font-size: 13px }
        .who { display: flex; align-items: center; gap: 12px; font-size: 14px }
        .who button { background: transparent; border: 1px solid rgba(255,255,255,.28); padding: 6px 14px; font-size: 13px }
        .who button:hover { background: rgba(255,255,255,.12) }
        .wrap { max-width: 880px; margin: 0 auto; padding: 24px 20px 48px }
        .card { background: #fff; border: 1px solid #e7eaf0; border-radius: 14px; box-shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06); padding: 26px }
        .login { max-width: 380px; margin: 12vh auto 0; display: flex; flex-direction: column; gap: 12px }
        .login h2 { text-align: center; font-size: 24px; letter-spacing: .01em; margin-bottom: 2px }
        .login-sub { text-align: center; color: #667085; font-size: 13px; margin-bottom: 4px }
        input { padding: 10px 12px; border: 1px solid #d0d5dd; border-radius: 10px; font-size: 14px; outline: none; background: #fff; color: #101828; transition: border-color .15s, box-shadow .15s }
        input:focus { border-color: #0f9488; box-shadow: 0 0 0 3px rgba(15,148,136,.14) }
        button { padding: 10px 16px; border: none; border-radius: 10px; background: #0f766e; color: #fff; cursor: pointer; font-size: 14px; white-space: nowrap; transition: background .15s, transform .05s }
        button:hover { background: #0d5f58 }
        button:active { transform: translateY(1px) }
        button:disabled { opacity: .45; cursor: default }
        button.ghost { background: #fff; border: 1px solid #d0d5dd; color: #344054 }
        button.ghost:hover { background: #f9fafb }
        button.danger { background: #dc2626 }
        button.danger:hover { background: #b42318 }
        .err { color: #dc2626; font-size: 13px }
        .tabs { display: flex; gap: 4px; margin-bottom: 20px; background: #e9edf3; border-radius: 12px; padding: 4px; width: fit-content }
        .tabs button { background: transparent; color: #475467; border-radius: 9px; padding: 8px 16px }
        .tabs button:hover { background: rgba(255,255,255,.65) }
        .tabs button.active { background: #101828; color: #fff }
        .rowline { display: flex; gap: 10px; margin-bottom: 16px }
        .rowline input { flex: 1 }
        ul.conv { list-style: none }
        ul.conv li { display: flex; align-items: center; gap: 12px; padding: 13px 8px; border-bottom: 1px solid #eef1f5; border-radius: 8px }
        ul.conv li:hover { background: #f8fafc }
        ul.conv li:last-child { border-bottom: none }
        ul.conv button { padding: 7px 12px; font-size: 13px }
        .c-title { flex: 1; font-weight: 600; color: #101828 }
        .c-time { color: #98a2b3; font-size: 12px; font-variant-numeric: tabular-nums }
        .empty-list, .empty { color: #98a2b3; text-align: center; padding: 26px 0; border: 1px dashed #d7dce5; border-radius: 10px; background: #fbfcfe; font-size: 14px }
        .msgs .empty { border: none; background: none; margin: auto }
        .chat-head { margin-bottom: 12px; font-size: 15px; color: #475467 }
        .chat-head b { color: #101828 }
        .msgs { height: 52vh; overflow-y: auto; background: #fafbfd; border: 1px solid #e9edf3; border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; margin-bottom: 12px }
        .msgs::-webkit-scrollbar { width: 8px }
        .msgs::-webkit-scrollbar-thumb { background: #d5dae2; border-radius: 4px }
        .row { display: flex }
        .row.right { justify-content: flex-end }
        .bubble { max-width: 72%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.65 }
        .bubble .content { white-space: pre-wrap; word-break: break-word }
        .bubble .time { font-size: 11px; opacity: .6; margin-top: 5px; font-variant-numeric: tabular-nums }
        .bubble.me { background: #0f766e; color: #fff; border-bottom-right-radius: 4px }
        .bubble.bot { background: #fff; border: 1px solid #e7eaf0; border-bottom-left-radius: 4px; box-shadow: 0 1px 2px rgba(16,24,40,.05) }
        .typing { color: #667085; animation: pulse 1.2s ease-in-out infinite }
        @keyframes pulse { 50% { opacity: .4 } }
        .chatin { display: flex; gap: 10px }
        .chatin input { flex: 1 }
        .doc { display: flex; flex-direction: column; gap: 12px }
        .doc b { color: #101828 }
        .doc p { font-size: 13px; color: #667085; line-height: 1.6 }
        .utable { width: 100%; border-collapse: collapse; font-size: 14px }
        .utable th, .utable td { text-align: left; padding: 11px 10px; border-bottom: 1px solid #eef1f5 }
        .utable th { color: #667085; font-weight: 600; font-size: 13px }
        .utable tbody tr:hover { background: #f8fafc }
        .utable td { font-variant-numeric: tabular-nums }
        .ops { white-space: nowrap }
        .ops button { margin-right: 8px; padding: 6px 11px; font-size: 13px; border-radius: 8px }
        .role { font-size: 12px; padding: 2px 9px; border-radius: 999px; background: #f2f4f7; color: #475467 }
        .r-admin { background: #fef3c7; color: #b45309 }
        .pager { display: flex; gap: 12px; align-items: center; margin-top: 14px; font-size: 13px; color: #667085 }
        .pager button { padding: 6px 12px; font-size: 13px }
        .tip { position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%); background: #101828; color: #fff; padding: 11px 20px; border-radius: 10px; font-size: 13px; box-shadow: 0 8px 24px rgba(16,24,40,.28); z-index: 9; animation: tipin .18s ease-out }
        @keyframes tipin { from { opacity: 0; transform: translate(-50%, 8px) } }
    </style>
</head>
<body>
<div id="app">
    <header>
        <div class="brand">java_fight<span>AI 知识库问答</span></div>
        <div class="who" v-if="token">
            <span>{{ username }}</span>
            <button @click="doLogout">退出</button>
        </div>
    </header>

    <div class="wrap">
        <!-- 登录页 -->
        <div class="card login" v-if="!token">
            <h2>java_fight</h2>
            <p class="login-sub">AI 知识库问答 · 登录后体验全部功能</p>
            <input v-model.trim="username" placeholder="用户名" @keyup.enter="login">
            <input v-model="password" type="password" placeholder="密码" @keyup.enter="login">
            <button @click="login">登 录</button>
            <p class="err" v-if="loginError">{{ loginError }}</p>
        </div>

        <template v-else>
            <nav class="tabs">
                <button :class="{active: tab === 'conv'}" @click="tab = 'conv'; loadConversations()">会话管理</button>
                <button :class="{active: tab === 'chat'}" @click="goChat()">AI 问答</button>
                <button :class="{active: tab === 'doc'}" @click="tab = 'doc'">知识库</button>
                <button :class="{active: tab === 'user'}" @click="goUsers()">用户管理</button>
            </nav>

            <!-- 会话管理页 -->
            <section v-show="tab === 'conv'">
                <div class="card">
                    <div class="rowline">
                        <input v-model="newTitle" placeholder="新会话标题" @keyup.enter="createConversation">
                        <button @click="createConversation">新建会话</button>
                    </div>
                    <ul class="conv" v-if="conversations.length">
                        <li v-for="c in conversations" :key="c.id">
                            <div class="c-title">{{ c.title }}</div>
                            <div class="c-time">{{ fmt(c.updatedAt) }}</div>
                            <button class="ghost" @click="openConv(c)">进入对话</button>
                            <button class="danger" @click="removeConversation(c)">删除</button>
                        </li>
                    </ul>
                    <div v-else class="empty-list">还没有会话，先新建一个</div>
                </div>
            </section>

            <!-- AI 问答页 -->
            <section v-show="tab === 'chat'">
                <div class="card" v-if="!currentConv" style="text-align:center;color:#9ca3af;padding:40px 24px">
                    还没有选中的会话，去「会话管理」新建或进入一个对话
                </div>
                <div class="card" v-else>
                    <div class="chat-head">当前会话：<b>{{ currentConv.title }}</b></div>
                    <div class="msgs" ref="box">
                        <div v-if="!messages.length" class="empty">还没有消息，发第一条试试</div>
                        <div v-for="m in messages" :key="m.id" class="row" :class="m.role === 'user' ? 'right' : ''">
                            <div class="bubble" :class="m.role === 'user' ? 'me' : 'bot'">
                                <div class="content">{{ m.content }}</div>
                                <div class="time">{{ fmt(m.createdAt) }}</div>
                            </div>
                        </div>
                        <div v-if="sending" class="row"><div class="bubble bot typing">模型思考中…</div></div>
                    </div>
                    <div class="chatin">
                        <input v-model="draft" placeholder="输入问题，回车发送" :disabled="sending" @keyup.enter="send">
                        <button @click="send" :disabled="sending || !draft.trim()">发送</button>
                    </div>
                </div>
            </section>

            <!-- 知识库页（RAG） -->
            <section v-show="tab === 'doc'">
                <div class="card doc">
                    <b>知识库文档（RAG）</b>
                    <p>上传 .txt / .md 文档，系统会切分并向量化入库；在「AI 问答」里提问时会自动检索你上传的文档内容作为参考。</p>
                    <div class="rowline" style="margin-bottom:0">
                        <input type="file" accept=".txt,.md,.markdown" @change="e => docFile = e.target.files[0]">
                        <button @click="uploadDoc" :disabled="!docFile || uploading">{{ uploading ? '上传中…' : '上传入库' }}</button>
                    </div>
                    <p v-if="docMsg" :class="docOk ? '' : 'err'">{{ docMsg }}</p>
                </div>
            </section>

            <!-- 用户管理页（ADMIN） -->
            <section v-show="tab === 'user'">
                <div class="card">
                    <div class="rowline">
                        <input v-model="userFilter" placeholder="按用户名筛选（可空）" @keyup.enter="loadUsers(1)">
                        <button @click="loadUsers(1)">查询</button>
                    </div>
                    <table class="utable">
                        <thead>
                            <tr><th>ID</th><th>用户名</th><th>年龄</th><th>角色</th><th>创建时间</th><th>操作</th></tr>
                        </thead>
                        <tbody>
                            <tr v-for="u in users" :key="u.id">
                                <td>{{ u.id }}</td>
                                <td>{{ u.username }}</td>
                                <td>{{ u.age }}</td>
                                <td><span class="role" :class="u.role === 'ADMIN' ? 'r-admin' : ''">{{ u.role }}</span></td>
                                <td>{{ fmt(u.createdAt) }}</td>
                                <td class="ops">
                                    <button class="ghost" @click="toggleRole(u)">{{ u.role === 'ADMIN' ? '降为 USER' : '升为 ADMIN' }}</button>
                                    <button class="danger" :disabled="u.username === username" @click="removeUser(u)">删除</button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="pager" v-if="userPages > 1">
                        <button class="ghost" :disabled="userPage <= 1" @click="loadUsers(userPage - 1)">上一页</button>
                        <span>{{ userPage }} / {{ userPages }}</span>
                        <button class="ghost" :disabled="userPage >= userPages" @click="loadUsers(userPage + 1)">下一页</button>
                    </div>
                    <div class="empty-list" v-if="!users.length">没有查到用户</div>
                </div>
                <div class="card" style="margin-top:16px">
                    <b>新建用户（ADMIN）</b>
                    <div class="rowline" style="margin:12px 0 0">
                        <input v-model="newUser.username" placeholder="用户名">
                        <input v-model="newUser.password" type="password" placeholder="密码">
                        <input v-model="newUser.age" placeholder="年龄" style="max-width:90px">
                        <button @click="createUser">创建</button>
                    </div>
                </div>
            </section>
        </template>
    </div>

    <div class="tip" v-if="tip">{{ tip }}</div>
</div>

<script>
    Vue.createApp({
        data() {
            return {
                token: '', username: '', password: '', loginError: '',
                tab: 'conv',
                conversations: [], newTitle: '',
                currentConv: null, messages: [], draft: '', sending: false,
                docFile: null, docMsg: '', docOk: false, uploading: false,
                users: [], userPage: 1, userPages: 1, userFilter: '',
                newUser: { username: '', password: '', age: '' },
                tip: ''
            }
        },
        methods: {
            fmt(s) { return String(s || '').replace('T', ' ').slice(0, 19) },
            showTip(t) { this.tip = t; clearTimeout(this._tt); this._tt = setTimeout(() => { this.tip = '' }, 3500) },

            async request(url, opts = {}) {
                if (this.token) {
                    opts.headers = Object.assign({}, opts.headers, { Authorization: 'Bearer ' + this.token })
                }
                let r
                try {
                    r = await fetch(url, opts)
                } catch (e) {
                    throw { msg: '网络错误：请用 http://localhost:8080/index.html 打开本页，不要双击文件' }
                }
                let body = {}
                try { body = await r.json() } catch (e) { }
                if (r.status === 401) throw { auth: true, msg: body.msg || '未登录或登录已过期' }
                return body
            },
            async postJSON(url, data) {
                return this.request(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                })
            },
            handleErr(e, fallback) {
                if (e && e.auth) { this.doLogout(); this.showTip(e.msg || '请先登录') }
                else { this.showTip((e && e.msg) || fallback) }
            },

            async login() {
                this.loginError = ''
                if (!this.username || !this.password) { this.loginError = '用户名和密码都要填'; return }
                try {
                    const res = await this.postJSON('/login', { username: this.username, password: this.password })
                    if (res.code === 1) {
                        this.token = res.data
                        this.loadConversations()
                    } else {
                        this.loginError = res.msg || '登录失败'
                    }
                } catch (e) {
                    this.loginError = e.msg || '登录失败'
                }
            },
            doLogout() {
                this.token = ''
                this.password = ''
                this.conversations = []
                this.currentConv = null
                this.messages = []
                this.tab = 'conv'
            },

            async loadConversations() {
                try {
                    const res = await this.request('/conversation/list')
                    if (res.code === 1) this.conversations = res.data || []
                    else this.showTip(res.msg || '获取会话列表失败')
                } catch (e) { this.handleErr(e, '获取会话列表失败') }
            },
            async createConversation() {
                const title = this.newTitle.trim() || '未命名会话'
                try {
                    const res = await this.postJSON('/conversation', { title })
                    if (res.code === 1) {
                        this.newTitle = ''
                        await this.loadConversations()
                        this.openConv(res.data)
                    } else this.showTip(res.msg || '创建失败')
                } catch (e) { this.handleErr(e, '创建失败') }
            },
            async removeConversation(c) {
                if (!confirm('删除会话「' + c.title + '」？')) return
                try {
                    const res = await this.request('/conversation/' + c.id, { method: 'DELETE' })
                    if (res.code === 1) {
                        if (this.currentConv && this.currentConv.id === c.id) {
                            this.currentConv = null
                            this.messages = []
                            this.tab = 'conv'
                        }
                        this.loadConversations()
                    } else this.showTip(res.msg || '删除失败')
                } catch (e) { this.handleErr(e, '删除失败') }
            },

            goChat() {
                this.tab = 'chat'
                if (!this.currentConv && this.conversations.length) this.openConv(this.conversations[0])
            },
            openConv(c) {
                this.currentConv = c
                this.tab = 'chat'
                this.draft = ''
                this.loadMessages()
            },
            async loadMessages() {
                try {
                    const res = await this.request('/message/list?conversationId=' + this.currentConv.id)
                    if (res.code === 1) {
                        this.messages = res.data || []
                        this.scrollBottom()
                    } else this.showTip(res.msg || '获取历史消息失败')
                } catch (e) { this.handleErr(e, '获取历史消息失败') }
            },
            async send() {
                const content = this.draft.trim()
                if (!content || this.sending) return
                this.sending = true
                try {
                    const res = await this.postJSON('/chat', { conversationId: this.currentConv.id, content })
                    if (res.code === 1) {
                        this.draft = ''
                        await this.loadMessages()
                    } else this.showTip(res.msg || '发送失败')
                } catch (e) { this.handleErr(e, '发送失败') }
                finally { this.sending = false }
            },
            scrollBottom() {
                this.$nextTick(() => {
                    const el = this.$refs.box
                    if (el) el.scrollTop = el.scrollHeight
                })
            },

            async uploadDoc() {
                if (!this.docFile || this.uploading) return
                this.uploading = true
                this.docMsg = ''
                try {
                    const fd = new FormData()
                    fd.append('file', this.docFile)
                    const res = await this.request('/doc/upload', { method: 'POST', body: fd })
                    if (res.code === 1) {
                        this.docOk = true
                        this.docMsg = '上传成功：已切分入库 ' + res.data + ' 块。去「AI 问答」问文档里的内容试试。'
                    } else {
                        this.docOk = false
                        this.docMsg = res.msg || '上传失败'
                    }
                } catch (e) {
                    this.docOk = false
                    this.docMsg = e.msg || '上传失败'
                    if (e.auth) this.handleErr(e)
                } finally {
                    this.uploading = false
                }
            },

            goUsers() {
                this.tab = 'user'
                this.loadUsers(this.userPage || 1)
            },
            async loadUsers(page) {
                try {
                    let url = '/users?page=' + page + '&pageSize=10'
                    if (this.userFilter.trim()) url += '&username=' + encodeURIComponent(this.userFilter.trim())
                    const res = await this.request(url)
                    if (res.code === 1) {
                        this.users = (res.data && res.data.records) || []
                        this.userPage = page
                        this.userPages = (res.data && res.data.totalPages) || 1
                    } else this.showTip(res.msg || '获取用户列表失败')
                } catch (e) { this.handleErr(e, '获取用户列表失败') }
            },
            async toggleRole(u) {
                const target = u.role === 'ADMIN' ? 'USER' : 'ADMIN'
                try {
                    const res = await this.postJSON('/updateRole', { userId: u.id, role: target })
                    if (res.code === 1) this.loadUsers(this.userPage)
                    else this.showTip(res.msg || '修改角色失败')
                } catch (e) { this.handleErr(e, '修改角色失败') }
            },
            async removeUser(u) {
                if (!confirm('删除用户「' + u.username + '」？')) return
                try {
                    const res = await this.request('/delete/' + u.id, { method: 'DELETE' })
                    if (res.code === 1) this.loadUsers(this.userPage)
                    else this.showTip(res.msg || '删除失败')
                } catch (e) { this.handleErr(e, '删除失败') }
            },
            async createUser() {
                if (!this.newUser.username || !this.newUser.password) { this.showTip('用户名和密码都要填'); return }
                try {
                    const body = { username: this.newUser.username, password: this.newUser.password }
                    if (this.newUser.age) body.age = Number(this.newUser.age)
                    const res = await this.postJSON('/insert', body)
                    if (res.code === 1) {
                        this.newUser = { username: '', password: '', age: '' }
                        this.showTip('用户已创建')
                        this.loadUsers(1)
                    } else this.showTip(res.msg || '创建失败')
                } catch (e) { this.handleErr(e, '创建失败') }
            }
        }
    }).mount('#app')
</script>
</body>
</html>
