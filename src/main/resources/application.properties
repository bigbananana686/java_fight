spring.application.name=java_fight
spring.datasource.url=jdbc:mysql://localhost:3306/java_fight?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.configuration.map-underscore-to-camel-case=true
spring.profiles.active=dev
jwt.secret=${JWT_SECRET}
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY}
spring.ai.deepseek.chat.model=deepseek-flash
spring.ai.model.chat=deepseek
spring.ai.model.embedding=ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.embedding.model=qwen3-embedding:0.6b
spring.http.clients.connect-timeout=5000
spring.http.clients.read-timeout=60000
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=10s


